<!doctype html>
<!-- Same canvas app as ../index.html; this path shows INVADE (docs/CANVAS_UNIFIED_V0.md §11). -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>WRECKLINE INVADE — canvas 試作</title>
    <style>
      html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #0d1117; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      #wl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #wl-canvas-name { position: fixed; box-sizing: border-box; margin: 0; padding: 0 12px; border: 0; border-radius: 7px; outline: none; background: #0d1117; color: #c9d1d9; font: 600 17px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
      #wl-canvas-name:focus { box-shadow: 0 0 0 2px #1f6feb; }
      /* Stage 1 (CANVAS-D5 神宮決定 2026-11-04): the recording panel stays in the existing edition. */
      #play-log-panel { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="wl-canvas" role="application" aria-label="WRECKLINE DOCK"></canvas>
      <input id="wl-canvas-name" type="text" autocomplete="nickname" enterkeyhint="go" aria-label="ユーザーネーム" placeholder="名前" hidden />
    </div>
    <script type="module" src="/src/canvas/boot.ts"></script>
  </body>
</html>
