# Modules preview (explore + sort + trade + invade + restore) — build and deploy GitHub Pages.
#
# Single GitHub Pages artifact with subpaths:
#   /           → trade hangar
#   /explore/   → explore
#   /sort/      → sort
#   /invade/   → invade
#   /restore/  → restore
#
# Live URLs (owner Xyngwie, project Pages):
#   https://xyngwie.github.io/-explore-sort-trade-game/
#   https://xyngwie.github.io/-explore-sort-trade-game/explore/
#   https://xyngwie.github.io/-explore-sort-trade-game/sort/
#   https://xyngwie.github.io/-explore-sort-trade-game/invade/
#   https://xyngwie.github.io/-explore-sort-trade-game/restore/
#
# GitHub Pages must use GitHub Actions as its source.

name: Deploy Modules Preview

on:
  push:
    branches: [main]
    paths:
      - "packages/explore/**"
      - "packages/sort/**"
      - "packages/trade/**"
      - "packages/invade/**"
      - "packages/restore/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-modules-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: modules-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build trade (Pages root)
        env:
          VITE_BASE: ${{ vars.TRADE_VITE_BASE || '/-explore-sort-trade-game/' }}
        run: npm run build:trade

      - name: Build explore (Pages /explore/)
        env:
          VITE_BASE: ${{ vars.EXPLORE_VITE_BASE || '/-explore-sort-trade-game/explore/' }}
        run: npm run build:explore

      - name: Build sort (Pages /sort/)
        env:
          VITE_BASE: ${{ vars.SORT_VITE_BASE || '/-explore-sort-trade-game/sort/' }}
        run: npm run build:sort

      - name: Build invade (Pages /invade/)
        env:
          VITE_BASE: ${{ vars.INVADE_VITE_BASE || '/-explore-sort-trade-game/invade/' }}
        run: npm run build:invade

      - name: Build restore (Pages /restore/)
        env:
          VITE_BASE: ${{ vars.RESTORE_VITE_BASE || '/-explore-sort-trade-game/restore/' }}
        run: npm run build:restore

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/explore _site/sort _site/invade _site/restore
          cp -a packages/trade/dist/. _site/
          cp -a packages/explore/dist/. _site/explore/
          cp -a packages/sort/dist/. _site/sort/
          cp -a packages/invade/dist/. _site/invade/
          cp -a packages/restore/dist/. _site/restore/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
