name: PR Build Check

on:
  pull_request:
    paths:
      - "packages/explore/**"
      - "packages/sort/**"
      - "packages/trade/**"
      - "packages/invade/**"
      - "packages/restore/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pr-build-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build trade
        env:
          VITE_BASE: "/-explore-sort-trade-game/"
        run: npm run build:trade

      - name: Build explore
        env:
          VITE_BASE: "/-explore-sort-trade-game/explore/"
        run: npm run build:explore

      - name: Build sort
        env:
          VITE_BASE: "/-explore-sort-trade-game/sort/"
        run: npm run build:sort

      - name: Build invade
        env:
          VITE_BASE: "/-explore-sort-trade-game/invade/"
        run: npm run build:invade

      - name: Build restore
        env:
          VITE_BASE: "/-explore-sort-trade-game/restore/"
        run: npm run build:restore
