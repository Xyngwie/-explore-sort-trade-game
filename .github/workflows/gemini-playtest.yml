name: Gemini Spark Autonomous Playtest

on:
  workflow_dispatch:
    issues:
        types: [labeled]

        permissions:
          contents: read
            issues: write

            jobs:
              playtest:
                  if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'playtest-request'
                      runs-on: ubuntu-latest

                          steps:
                                - name: Checkout repository
                                        uses: actions/checkout@v4

                                              - name: Setup Node.js
                                                      uses: actions/setup-node@v4
                                                              with:
                                                                        node-version: 20

                                                                              - name: Run Gemini Playtest Agent
                                                                                      env:
                                                                                                GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                                                                                                          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                    ISSUE_NUMBER: ${{ github.event.issue.number }}
                                                                                                                              GITHUB_REPOSITORY: ${{ github.repository }}
                                                                                                                                      run: |
                                                                                                                                                node <<'NODE'
                                                                                                                                                          const https = require('https');
                                                                                                                                                          
                                                                                                                                                                    const urls = [
                                                                                                                                                                                { name: 'Explore', url: 'https://xyngwie.github.io/-explore-sort-trade-game/explore/' },
                                                                                                                                                                                            { name: 'Sort', url: 'https://xyngwie.github.io/-explore-sort-trade-game/sort/' },
                                                                                                                                                                                                        { name: 'Trade/HUB', url: 'https://xyngwie.github.io/-explore-sort-trade-game/' },
                                                                                                                                                                                                                    { name: 'Invade', url: 'https://xyngwie.github.io/-explore-sort-trade-game/invade/' },
                                                                                                                                                                                                                                { name: 'Restore', url: 'https://xyngwie.github.io/-explore-sort-trade-game/restore/' }
                                                                                                                                                                                                                                          ];
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                    function checkUrl(target) {
                                                                                                                                                                                                                                                                return new Promise((resolve) => {
                                                                                                                                                                                                                                                                              https.get(target.url, (res) => {
                                                                                                                                                                                                                                                                                              res.resume();
                                                                                                                                                                                                                                                                                                              resolve({ name: target.name, url: target.url, statusCode: res.statusCode });
                                                                                                                                                                                                                                                                                                                            }).on('error', (err) => {
                                                                                                                                                                                                                                                                                                                                            resolve({ name: target.name, url: target.url, error: err.message });
                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                          function httpsJson(method, hostname, path, headers, body) {
                                                                                                                                                                                                                                                                                                                                                                                                      return new Promise((resolve, reject) => {
                                                                                                                                                                                                                                                                                                                                                                                                                    const req = https.request({ hostname, path, method, headers }, (res) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                    let data = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                    res.on('data', (chunk) => (data += chunk));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    res.on('end', () => resolve({ statusCode: res.statusCode, data }));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                req.on('error', reject);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (body) req.write(body);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            req.end();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            (async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const healthResults = await Promise.all(urls.map(checkUrl));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log('Health checks:', JSON.stringify(healthResults, null, 2));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const apiKey = process.env.GEMINI_API_KEY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!apiKey) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.error('GEMINI_API_KEY is not set');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const prompt = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              contents: [{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              parts: [{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    'You are Gemini Spark playtest agent for -explore-sort-trade-game. ' +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        'Analyze these module health results and output a structured playtest report JSON only.\n' +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            JSON.stringify(healthResults, null, 2)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const gemini = await httpsJson(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              'generativelanguage.googleapis.com',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            '/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        JSON.stringify(prompt)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.log('Gemini API Response Status:', gemini.statusCode);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const body =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          '### Gemini Spark 自動テスト結果\n\n```json\n' +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        gemini.data +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '\n```\n';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const issueNum = process.env.ISSUE_NUMBER;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (issueNum) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const ghToken = process.env.GITHUB_TOKEN;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const repo = process.env.GITHUB_REPOSITORY || '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const [owner, name] = repo.split('/');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!owner || !name || !ghToken) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.error('Missing GITHUB_TOKEN or GITHUB_REPOSITORY for issue comment');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const comment = await httpsJson(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  'api.github.com',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  '/repos/' + owner + '/' + name + '/issues/' + issueNum + '/comments',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Authorization: 'Bearer ' + ghToken,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      'User-Agent': 'Gemini-Spark-Agent',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Accept: 'application/vnd.github+json',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          'Content-Type': 'application/json'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          JSON.stringify({ body })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log('Issue comment status:', comment.statusCode);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.log('No ISSUE_NUMBER (workflow_dispatch); result logged above only.');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      })().catch((err) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  console.error(err);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  NODE
