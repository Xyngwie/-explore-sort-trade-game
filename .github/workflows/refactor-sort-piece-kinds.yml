name: Refactor Sort piece kinds

on:
  push:
    branches:
      - refactor/sort-piece-kinds-v4

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sort-piece-kinds-v4
          fetch-depth: 0

      - name: Rename Sort piece kinds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("packages/sort/src").glob("*.ts"))
          replacements = (("food", "ammo"), ("material", "armor"), ("energy", "power"))
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(f'"{old}"', f'"{new}"')
                  text = text.replace(f"'{old}'", f"'{new}'")
                  text = text.replace(f"{old}:", f"{new}:")
                  text = text.replace(f".{old}", f".{new}")
                  text = text.replace(f"| {old}", f"| {new}")
                  text = text.replace(f"|{old}", f"|{new}")
                  text = text.replace(f"{old} |", f"{new} |")
              text = text.replace('food/material/energy', 'ammo/armor/power')
              text = text.replace('食料', '弾薬').replace('部品', '装甲パーツ')
              if text != original:
                  path.write_text(text)
          PY

      - name: Remove shared Sort legacy conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/shared/src/sort-yield.ts")
          text = path.read_text()
          old = '''/** Temporary board-input compatibility: the current Sort engine still emits these names. */
          export type LegacySortPieceType = "food" | "material" | "energy";
          export type ClearedPieceCounts =
            | Record<SortPieceType, number>
            | Record<LegacySortPieceType, number>;
          '''
          new = '''export type ClearedPieceCounts = Record<SortPieceType, number>;
          '''
          if old not in text:
              raise SystemExit("Legacy type block not found")
          text = text.replace(old, new)
          old_fn = '''export function yieldBagFromClearedCounts(cleared: ClearedPieceCounts): YieldBag {
            if ("ammo" in cleared) {
              return compactYieldBag({
                ammo: cleared.ammo,
                armor: cleared.armor,
                power: cleared.power,
              });
            }

            // Temporary migration path until the Sort board input itself is renamed.
            return compactYieldBag({
              ammo: cleared.food,
              armor: cleared.material,
              power: cleared.energy,
            });
          }
          '''
          new_fn = '''export function yieldBagFromClearedCounts(cleared: ClearedPieceCounts): YieldBag {
            return compactYieldBag({
              ammo: cleared.ammo,
              armor: cleared.armor,
              power: cleared.power,
            });
          }
          '''
          if old_fn not in text:
              raise SystemExit("Legacy conversion function not found")
          text = text.replace(old_fn, new_fn)
          path.write_text(text)
          PY

      - name: Update Sort yield comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/shared/src/sort-yield.ts")
          text = path.read_text().replace("/** Compatibility aliases for older UI callers. They contain only the new four resources. */", "/** Compatibility aliases for callers that still use the old label helper names. */")
          path.write_text(text)
          PY

      - name: Validate migration and save report
        shell: bash
        run: |
          set +e
          : > migration-validation.log
          npm ci >> migration-validation.log 2>&1
          npm run --workspace @estg/shared typecheck >> migration-validation.log 2>&1
          shared_rc=$?
          npm run --workspace @estg/sort typecheck >> migration-validation.log 2>&1
          sort_typecheck_rc=$?
          npm run --workspace @estg/sort selftest >> migration-validation.log 2>&1
          sort_selftest_rc=$?
          printf '\nRESULTS shared=%s sort_typecheck=%s sort_selftest=%s\n' "$shared_rc" "$sort_typecheck_rc" "$sort_selftest_rc" >> migration-validation.log
          if [ "$shared_rc" -eq 0 ] && [ "$sort_typecheck_rc" -eq 0 ] && [ "$sort_selftest_rc" -eq 0 ]; then
            echo SUCCESS > migration-validation.status
          else
            echo FAILURE > migration-validation.status
          fi
          exit 0

      - name: Commit migration or validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat migration-validation.status)" = "SUCCESS" ]; then
            rm -f migration-validation.log migration-validation.status packages/sort/SORT_PIECE_KIND_MIGRATION_TRIGGER.md
            git add -A
            git commit -m "refactor(sort): use four-resource piece kinds internally"
          else
            git add migration-validation.log migration-validation.status
            git commit -m "test(sort): record four-resource migration validation"
          fi
          git push origin HEAD:refactor/sort-piece-kinds-v4
