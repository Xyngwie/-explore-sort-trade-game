name: Agent Dispatcher

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Agent Dispatcher
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.issue.pull_request != null && github.event.issue.number || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_WEBHOOK_AUTH_INSPECTOR: ${{ secrets.CURSOR_WEBHOOK_AUTH_INSPECTOR }}
          CURSOR_WEBHOOK_AUTH_LEAD: ${{ secrets.CURSOR_WEBHOOK_AUTH_LEAD }}
          CURSOR_WEBHOOK_AUTH_ARROW: ${{ secrets.CURSOR_WEBHOOK_AUTH_ARROW }}
          CURSOR_WEBHOOK_AUTH_JAVELIN: ${{ secrets.CURSOR_WEBHOOK_AUTH_JAVELIN }}
          CURSOR_WEBHOOK_AUTH_TOMAHAWK: ${{ secrets.CURSOR_WEBHOOK_AUTH_TOMAHAWK }}
        run: |
          python scripts/dispatch_agent.py
